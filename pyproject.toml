[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evidencegraphai"
version = "0.1.0"
description = "Graph-based multi-agent framework for cybercrime investigation and threat reconstruction"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "Apache-2.0"}
authors = [
    {name = "EvidenceGraphAI Team", email = "dev@evidencegraphai.io"}
]
dependencies = [
    "neo4j==5.20.0",
    "pydantic==2.7.4",
    "pydantic-settings==2.3.4",
    "structlog==24.2.0",
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "prometheus-client==0.20.0",
    "python-dotenv==1.0.1",
    "pyyaml==6.0.1",
    "psycopg[binary]==3.1.19",
    "minio==7.2.7",
    "cryptography==42.0.8",
    "python-magic-bin==0.4.14; sys_platform == 'win32'",
    "python-magic==0.4.27; sys_platform != 'win32'"
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-cov==5.0.0",
    "pytest-asyncio==0.23.7",
    "ruff==0.4.10",
    "black==24.4.2",
    "mypy==1.10.0",
    "pre-commit==3.7.1"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "api*", "agents*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["B008", "E501"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "neo4j.*",
    "prometheus_client.*",
    "yaml.*",
    "minio.*",
    "magic.*",
    "psycopg.*",
    "psycopg_pool.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=core --cov-report=term-missing"
testpaths = [
    "tests"
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
