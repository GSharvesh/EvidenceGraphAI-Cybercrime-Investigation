name: EvidenceGraphAI CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  lint:
    name: Lint & Code Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run Ruff Check
        run: ruff check .
      - name: Run Black Formatting Check
        run: black --check .

  typecheck:
    name: Static Type Checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run MyPy Type Check
        run: mypy core api

  test-unit:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run Unit Tests
        run: |
          pytest tests/unit -v \
            --cov=core \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=75

  test-integration:
    name: Docker Compose Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Start Services with Docker Compose
        run: docker compose -f infra/docker/docker-compose.yml up -d
      - name: Wait for Neo4j Health
        run: |
          echo "Waiting for Neo4j..."
          until [ "$(docker inspect --format='{{.State.Health.Status}}' evidencegraphai-neo4j 2>/dev/null)" == "healthy" ]; do
            sleep 3
          done
      - name: Seed Neo4j Ontology (Phase 0 + Phase 1 Indexes)
        run: python infra/scripts/seed_ontology.py
      - name: Run Integration Tests
        run: |
          pytest tests/unit tests/integration -v \
            --cov=core \
            --cov-report=term-missing \
            --cov-fail-under=85
      - name: Tear Down Docker Compose
        if: always()
        run: docker compose -f infra/docker/docker-compose.yml down -v

  validate-graph:
    name: Graph Schema Validation
    runs-on: ubuntu-latest
    needs: [test-integration]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Start Services with Docker Compose
        run: docker compose -f infra/docker/docker-compose.yml up -d
      - name: Wait for Neo4j Health
        run: |
          echo "Waiting for Neo4j..."
          until [ "$(docker inspect --format='{{.State.Health.Status}}' evidencegraphai-neo4j 2>/dev/null)" == "healthy" ]; do
            sleep 3
          done
      - name: Seed Neo4j Ontology
        run: python infra/scripts/seed_ontology.py
      - name: Seed Sample Graph
        run: python scripts/seed_sample_graph.py
      - name: Validate Graph (fail on error violations)
        run: python -m core.graph.validator --fail-on error --json
      - name: Tear Down Docker Compose
        if: always()
        run: docker compose -f infra/docker/docker-compose.yml down -v

  build:
    name: Package Build Verification
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-unit]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Build Tool
        run: pip install build
      - name: Build Package
        run: python -m build
